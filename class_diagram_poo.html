
<style>
#cd { padding: 1rem 0; }
#cd svg { width: 100% !important; height: auto !important; }
</style>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    classText: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#7F77DD' : '#534AB7',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryBorderColor: dark ? '#1D9E75' : '#0F6E56',
    secondaryTextColor: dark ? '#9FE1CB' : '#04342C',
    tertiaryColor: dark ? '#3B3834' : '#F1EFE8',
    tertiaryBorderColor: dark ? '#888780' : '#5F5E5A',
    tertiaryTextColor: dark ? '#D3D1C7' : '#2C2C2A',
    noteBkgColor: dark ? '#412402' : '#FAEEDA',
    noteTextColor: dark ? '#FAC775' : '#412402',
  },
});
const diagram = `classDiagram
  direction TB

  class Usuario {
    +String id
    +String nome
    +String email
    -String senha
    +Date criadoEm
    +login() void
    +logout() void
    +atualizarPerfil() void
    +obterResumo() Relatorio
  }

  class Conta {
    +String id
    +String nome
    +Float saldo
    +String moeda
    +TipoConta tipo
    +depositar(valor) void
    +sacar(valor) void
    +obterSaldo() Float
    +listarTransacoes() List~Transacao~
  }

  class Transacao {
    +String id
    +Float valor
    +TipoTransacao tipo
    +String descricao
    +Date data
    +calcularTotal() Float
    +categorizar(cat) void
    +editar() void
  }

  class Categoria {
    +String id
    +String nome
    +String icone
    +String cor
    +TipoCategoria tipo
    +listarTransacoes() List~Transacao~
    +calcularTotal() Float
  }

  class Orcamento {
    +String id
    +Float limite
    +PeriodoOrcamento periodo
    +Float gastoAtual
    +verificarLimite() Boolean
    +obterSaldo() Float
    +resetar() void
  }

  class Relatorio {
    +String id
    +String periodo
    +Date geradoEm
    +gerarResumo() Map
    +obterDadosGrafico() List
    +exportar(formato) File
  }

  class TipoConta {
    <<enumeration>>
    BANCO
    DINHEIRO
    CARTAO_CREDITO
    INVESTIMENTO
  }

  class TipoTransacao {
    <<enumeration>>
    RECEITA
    DESPESA
    TRANSFERENCIA
  }

  class TipoCategoria {
    <<enumeration>>
    RECEITA
    DESPESA
  }

  class PeriodoOrcamento {
    <<enumeration>>
    SEMANAL
    MENSAL
    ANUAL
  }

  Usuario "1" --> "0..*" Conta : possui
  Usuario "1" --> "0..*" Orcamento : define
  Usuario "1" --> "0..*" Relatorio : gera
  Conta "1" --> "0..*" Transacao : registra
  Transacao "0..*" --> "1" Categoria : pertence a
  Orcamento "0..*" --> "1" Categoria : monitora
  Relatorio "1" --> "0..*" Transacao : analisa
  Conta --> TipoConta : usa
  Transacao --> TipoTransacao : usa
  Categoria --> TipoCategoria : usa
  Orcamento --> PeriodoOrcamento : usa
`;
const { svg } = await mermaid.render('cd-svg', diagram);
document.getElementById('cd').innerHTML = svg;
</script>
